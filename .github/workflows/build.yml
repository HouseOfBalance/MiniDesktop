name: Build MiniPC APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip and Fix Import
        run: |
          unzip -q MiniPcDesktop.zip
          sed -i '/^package /a import androidx.compose.ui.input.pointer.isSecondaryPressed' MiniPcDesktop/app/src/main/java/com/minipc/desktop/ui/common/Common.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ./MiniPcDesktop
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniPC-Debug-APK
          path: MiniPcDesktop/app/build/outputs/apk/debug/*.apk
