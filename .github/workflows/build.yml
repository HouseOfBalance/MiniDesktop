name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Dự án chưa có gradlew nên dùng Gradle 8.7 do action cài sẵn (có cache)
      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build bản release (đã nén code + Baseline Profile)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build bản debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: MiniPC-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: MiniPC-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload báo cáo lỗi (nếu build hỏng)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
