name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Giải nén và tìm thư mục project
        id: proj
        run: |
          rm -rf build_workspace
          mkdir build_workspace
          LATEST_ZIP=$(ls -t *.zip 2>/dev/null | head -1)
          if [ -n "$LATEST_ZIP" ]; then
            echo "Đang giải nén: $LATEST_ZIP"
            unzip -o -q "$LATEST_ZIP" -d build_workspace
          else
            cp -r ./* build_workspace/ 2>/dev/null || true
          fi

          COMMON_FILE=$(find build_workspace -name "Common.kt" | head -n 1)
          if [ -n "$COMMON_FILE" ]; then
            grep -q "import androidx.compose.ui.input.pointer.isSecondaryPressed" "$COMMON_FILE" || sed -i '/^package /a import androidx.compose.ui.input.pointer.isSecondaryPressed' "$COMMON_FILE"
          fi

          f=$(find build_workspace -name settings.gradle.kts | head -1)
          if [ -z "$f" ]; then
            echo "::error::Không thấy settings.gradle.kts"
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build bản debug
        run: |
          set -o pipefail
          gradle -p "${{ steps.proj.outputs.dir }}" assembleDebug --no-daemon --console=plain 2>&1 | tee build_debug.log || {
            echo "========== CHI TIẾT LỖI CODE =========="
            grep -E "^e: |Unresolved reference|Exception" build_debug.log || true
            exit 1
          }

      - name: Build bản release (nén code + Baseline Profile)
        run: |
          set -o pipefail
          gradle -p "${{ steps.proj.outputs.dir }}" assembleRelease --no-daemon --console=plain 2>&1 | tee build_release.log || {
            echo "========== CHI TIẾT LỖI CODE =========="
            grep -E "^e: |Unresolved reference|Exception" build_release.log || true
            exit 1
          }

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: MiniPC-debug
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: MiniPC-release
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          
