name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tìm thư mục project (nơi có settings.gradle.kts)
        id: proj
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            echo "::error::Không thấy settings.gradle.kts trong repo. Cấu trúc hiện tại:"
            find . -maxdepth 3 -not -path './.git*' | head -60
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Project nằm ở: $(dirname "$f")"

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Dự án chưa có gradlew nên dùng Gradle 8.7 do action cài sẵn (có cache)
      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build bản debug
        run: gradle -p "${{ steps.proj.outputs.dir }}" assembleDebug --no-daemon --console=plain

      - name: Build bản release (nén code + Baseline Profile)
        run: gradle -p "${{ steps.proj.outputs.dir }}" assembleRelease --no-daemon --console=plain

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: MiniPC-debug
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: MiniPC-release
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload báo cáo lỗi (nếu build hỏng)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ steps.proj.outputs.dir }}/app/build/reports/**
          if-no-files-found: ignore
