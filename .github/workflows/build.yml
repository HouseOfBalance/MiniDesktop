name: Build MiniPC Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip Latest Source & Inject Release Optimizations
        run: |
          rm -rf build_workspace
          mkdir build_workspace
          LATEST_ZIP=$(ls -t *.zip | head -n 1)
          unzip -o -q "$LATEST_ZIP" -d build_workspace

          # 1. Fix thiếu import chuột phải nếu có
          COMMON_FILE=$(find build_workspace -name "Common.kt" | head -n 1)
          if [ -n "$COMMON_FILE" ]; then
            grep -q "import androidx.compose.ui.input.pointer.isSecondaryPressed" "$COMMON_FILE" || sed -i '/^package /a import androidx.compose.ui.input.pointer.isSecondaryPressed' "$COMMON_FILE"
          fi

          APP_DIR=$(dirname $(find build_workspace -name "AndroidManifest.xml" | head -n 1))/../..

          # 2. Tạo ProGuard Rules bảo vệ Reflection (VirtualDisplay, InputInjector, Shizuku, Room)
          cat << 'EOF' > "$APP_DIR/proguard-rules.pro"
          -keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod
          -keep class com.minipc.desktop.** { *; }
          -keep class rikka.shizuku.** { *; }
          -keep class android.hardware.display.** { *; }
          -keep class android.view.** { *; }
          -dontwarn android.**
          -dontwarn rikka.shizuku.**
          EOF

          # 3. Tạo Baseline Profile giúp AOT compile trước toàn bộ UI Compose & Window Manager
          mkdir -p "$APP_DIR/src/main/baseline-prof.txt"
          rm -rf "$APP_DIR/src/main/baseline-prof.txt"
          cat << 'EOF' > "$APP_DIR/src/main/baseline-prof.txt"
          HSPLcom/minipc/desktop/**;->**(**)**
          Lcom/minipc/desktop/**;
          HSPLandroidx/compose/**;->**(**)**
          EOF

          # 4. Bật minify, shrinkResources, signingConfig debug cho bản Release và thêm ProfileInstaller
          BUILD_GRADLE=$(find build_workspace -path "*/app/build.gradle.kts" | head -n 1)
          sed -i 's/isMinifyEnabled = false/isMinifyEnabled = true\n            isShrinkResources = true\n            signingConfig = signingConfigs.getByName("debug")\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")/g' "$BUILD_GRADLE"
          sed -i '/dependencies {/a \    implementation("androidx.profileinstaller:profileinstaller:1.3.1")' "$BUILD_GRADLE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Optimized Release APK
        run: |
          SETTINGS_FILE=$(find build_workspace -name "settings.gradle.kts" | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$PROJECT_DIR"
          gradle assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniPC-Release-APK
          path: "build_workspace/**/app/build/outputs/apk/release/*.apk"
