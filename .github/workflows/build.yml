name: Build MiniPC APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip and Fix Import
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o -q "$z"
            fi
          done
          COMMON_FILE=$(find . -name "Common.kt" | head -n 1)
          if [ -n "$COMMON_FILE" ]; then
            grep -q "import androidx.compose.ui.input.pointer.isSecondaryPressed" "$COMMON_FILE" || sed -i '/^package /a import androidx.compose.ui.input.pointer.isSecondaryPressed' "$COMMON_FILE"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          SETTINGS_FILE=$(find . -name "settings.gradle.kts" | head -n 1)
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniPC-Debug-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          
